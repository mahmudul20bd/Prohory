spring.application.name=CyberAwareServer

# 1. Database Connection

spring.datasource.url=jdbc:mysql://localhost:3306/cyberaware_db
spring.datasource.username=root
spring.datasource.password=

# 2. JPA Settings (Automatic Table)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Server Port
server.port=8080

# H2 Database Configuration (In-Memory)
#spring.datasource.url=jdbc:h2:mem:cyberaware_db
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console (To view DB in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console